name: 编译与发布
# 新增 run-name，让 Actions 列表中的单次运行记录也显示为中文
run-name: 🚀 ${{ github.actor }} 手动触发的编译与发布流程

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: '自定义发布标签（留空则自动按时间生成 Tag）'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TARGET: mediatek
  SUBTARGET: filogic
  PKG_ARCH: aarch64_cortex-a53

jobs:
  # 三个矩阵目标共享同一套流程。实测耗时构成（v7.0.2 冷构建 1h34m）：
  #   - package/kernel/linux 约 33 分钟：Kernel/CompileModules 固定跑
  #     `all modules`，`all` 会编出整个 vmlinux（含目标配置的数百个 =y
  #     设备驱动 + DWARF + BTF），本插件的 .ko 一个都用不到
  #   - luci-base 依赖闭包 + SDK 默认包（约 35 个）约 8 分钟
  #   - 其余为 SDK 解压、feeds、Rust 等固定开销
  # 因此做四层优化：
  #   1. 裁剪 filogic 目标配置的设备驱动（generic 核心配置原样保留，
  #      struct module 布局只取决于后者与 CONFIG_KERNEL_* 覆盖层），
  #      vmlinux 只剩核心，内核阶段降到分钟级
  #   2. CONFIG_CCACHE=y + 缓存 .ccache：内核版本升级（master 快照常见）
  #      时绝大多数对象命中，重编降到约 5-10 分钟
  #   3. build-* 缓存 build_dir/staging_dir：输入不变时整个内核与闭包
  #      直接复用，单作业约 8 分钟
  #   4. 关闭 SDK 的 ALL/ALL_KMODS/ALL_NONSHARED 默认并裁掉无关默认包，
  #      依赖闭包只含本应用真实依赖
  # 注意 build-* 缓存必须用精确键（SDK 指纹 + 内核版本 + 内核配置指纹），
  # 不能用 restore-keys 前缀回退——回退会复用旧配置编译的内核，让
  # 「生成内核配置覆盖层」静默失效，编出与官方固件不兼容的 .ko。
  build:
    name: 📦 编译 ${{ matrix.tag }} (${{ matrix.version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: 'OpenWrt 24.10.8'
            sdk_url: 'https://downloads.openwrt.org/releases/24.10.8/targets/mediatek/filogic/openwrt-sdk-24.10.8-mediatek-filogic_gcc-13.3.0_musl.Linux-x86_64.tar.zst'
            # 官方镜像构建时使用的顶层 .config（CONFIG_KERNEL_* 段即官方内核配置），
            # 用于把 SDK 的内核编译配置对齐到官方固件，见「生成内核配置覆盖层」
            config_url: 'https://downloads.openwrt.org/releases/24.10.8/targets/mediatek/filogic/config.buildinfo'
            tag: 'ipk'
          - version: 'OpenWrt 25.12.5'
            sdk_url: 'https://downloads.openwrt.org/releases/25.12.5/targets/mediatek/filogic/openwrt-sdk-25.12.5-mediatek-filogic_gcc-14.3.0_musl.Linux-x86_64.tar.zst'
            config_url: 'https://downloads.openwrt.org/releases/25.12.5/targets/mediatek/filogic/config.buildinfo'
            tag: 'apk'
          # immortalwrt master 快照 SDK(当前为 kernel 6.18),用于验证最新内核适配
          # config.buildinfo 与 SDK 取自同一次快照（同一目录），避免两者跨越更新
          - version: 'ImmortalWrt master'
            sdk_url: ''
            config_url: ''
            tag: 'immortalwrt-master'

    steps:
      - name: 记录开始时间
        run: echo "BUILD_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: 检出源码
        uses: actions/checkout@v4
        with:
          path: pkgsrc
          fetch-depth: 1

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gettext git bc \
            libncurses-dev libssl-dev libelf-dev python3 python3-setuptools \
            rsync swig unzip zlib1g-dev file wget zstd \
            dwarves
          # dwarves 提供 pahole：官方固件的内核配置开启了 DEBUG_INFO_BTF(_MODULES)，
          # 对齐后 SDK 内核编译需要它才能为模块生成 .BTF；缺失时编出的 .ko
          # 与官方模块结构不同，甚至可能被内核拒绝加载。

      - name: 计算 feeds 缓存时间桶
        id: bucket
        run: echo "week=$(date +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: 解析 SDK 下载地址与官方内核配置
        id: sdkurl
        run: |
          set -euo pipefail
          if [ -n "${{ matrix.sdk_url }}" ]; then
            URL="${{ matrix.sdk_url }}"
            CFG_URL="${{ matrix.config_url }}"
          else
            # ImmortalWrt master 快照:从下载目录动态解析最新 SDK 文件名
            BASE="https://downloads.immortalwrt.org/snapshots/targets/${TARGET}/${SUBTARGET}"
            LISTING=$(wget -qO- "$BASE/")
            SDK_FILE=$(echo "$LISTING" | grep -oE 'immortalwrt-sdk-[^"]+\.Linux-x86_64\.tar\.zst' | head -1)
            [ -n "$SDK_FILE" ] || { echo "::error::无法从 $BASE 解析 SDK 文件名"; exit 1; }
            URL="$BASE/$SDK_FILE"
            # 同目录下的 config.buildinfo 即该快照官方镜像的内核配置，与 SDK
            # 取自同一次快照，两者不会跨越快照更新而失配
            CFG_URL="$BASE/config.buildinfo"
          fi
          # config.buildinfo 是官方镜像构建时使用的顶层 .config，其中
          # CONFIG_KERNEL_* 段经 include/kernel-defaults.mk 剥前缀合并进内核
          # .config，是「.ko 与官方固件 ABI 兼容」的唯一权威来源
          wget -qO config.buildinfo "$CFG_URL"
          [ -s config.buildinfo ] || { echo "::error::下载官方内核配置失败: $CFG_URL"; exit 1; }
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "hash=$(printf '%s' "$URL" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
          echo "config=$CFG_URL" >> "$GITHUB_OUTPUT"
          echo "SDK: $URL"
          echo "官方内核配置: $CFG_URL"

      # SDK 解压后约 1-1.5GB,是单次运行最大的固定开销。缓存键取自下载地址,
      # 固定版本 SDK 可长期命中,快照 SDK 换包时自动失效。
      - name: 恢复 SDK 缓存
        id: cache-sdk
        uses: actions/cache/restore@v4
        with:
          path: sdk
          key: sdk-${{ matrix.tag }}-${{ steps.sdkurl.outputs.hash }}-${{ hashFiles('pkgsrc/**/Makefile') }}
          restore-keys: |
            sdk-${{ matrix.tag }}-${{ steps.sdkurl.outputs.hash }}-

      - name: 下载并解压 SDK
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          wget -q -O sdk.tar.zst "${{ steps.sdkurl.outputs.url }}"
          mkdir -p "$GITHUB_WORKSPACE/sdk"
          tar --zstd -xf sdk.tar.zst -C "$GITHUB_WORKSPACE/sdk" --strip-components=1
          rm -f sdk.tar.zst

      # 在 feeds 更新之前保存,保证缓存里是干净的 SDK,不含 feeds 与构建产物
      - name: 保存 SDK 缓存
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: sdk
          key: sdk-${{ matrix.tag }}-${{ steps.sdkurl.outputs.hash }}-${{ hashFiles('pkgsrc/**/Makefile') }}

      - name: 解析内核版本
        id: kver
        working-directory: sdk
        run: |
          set -euo pipefail
          # 构建缓存键里带上内核版本：同一 SDK 指纹下内核变版本时自动失效，
          # 避免复用为旧内核编译出来的 build_dir / staging_dir。
          KVER=$(basename "$(ls -d build_dir/target-*/linux-*/linux-* 2>/dev/null | head -1)" 2>/dev/null || true)
          [ -n "$KVER" ] || KVER=unknown
          echo "kver=$KVER" >> "$GITHUB_OUTPUT"
          echo "内核版本: $KVER"

      # SDK 的 Config.in 是重新生成的（BUILDBOT 预设），不保证内核符号默认值
      # 与官方镜像构建一致。即使 vermagic 完全相同，struct module 布局不同也会
      # 让内核拒绝加载编出来的 .ko（实机取证见 README「差异根源」一节）：
      #   ".gnu.linkonce.this_module section size must match ..."
      # 把官方 config.buildinfo 的 CONFIG_KERNEL_* 段作为覆盖层写进 SDK 的
      # .config，内核即按官方固件的配置编译（合并机制见
      # include/kernel-defaults.mk 的 Kernel/Configure/Default）。
      # 这里不做符号存在性过滤：覆盖层与 SDK 同版本同源，万一出现未知符号，
      # 「生成编译配置」会验证它确实进入 .config，「校验内核配置与官方固件一致」
      # 会在编译后对照内核 .config 复核，两层都会让作业快速失败而不是静默出错。
      - name: 生成内核配置覆盖层
        id: kconf
        run: |
          set -euo pipefail
          # ---- 裁剪 filogic 目标配置里的 MediaTek 厂商驱动 ----
          # Kernel/CompileModules 跑 `all modules`，`all` 会编译整个 vmlinux，
          # 目标配置里的厂商驱动（以太网/WED/NAND/时钟/pinctrl/PHY 等）占内核
          # 阶段相当一部分时间，本插件的 .ko 一个都用不到（符号在 insmod 时才
          # 向运行内核解析，编译期只需核心头文件）。
          # 只裁符号名含厂商 token（MEDIATEK/MTK/MT76/MT79/MT798/AIROHA/AN8855）
          # 的 =y 驱动，其余（SMP/PWM/HWMON/MODULES_TREE_LOOKUP 等框架与核心，
          # 其中部分会影响 struct module 布局与 vermagic）一律保留——宁可少裁
          # 也不能破坏与官方固件的 ABI。CONFIG_ARCH_* 是架构核心，始终保留。
          PRUNED=0
          for f in sdk/target/linux/mediatek/filogic/config-6.*; do
            [ -f "$f" ] || continue
            tmp="$f.tmp"
            : > "$tmp"
            while IFS= read -r line; do
              case "$line" in
                CONFIG_*=y)
                  sym=${line%%=y}
                  case "$sym" in
                    *MEDIATEK*|*MTK*|*MT76*|*MT79*|*MT798*|*AIROHA*|*AN8855*)
                      case "$sym" in
                        CONFIG_ARCH_*) printf '%s\n' "$line" >> "$tmp" ;;
                        *)
                          printf '# %s is not set\n' "$sym" >> "$tmp"
                          PRUNED=$((PRUNED+1))
                          ;;
                      esac
                      ;;
                    *) printf '%s\n' "$line" >> "$tmp" ;;
                  esac
                  ;;
                *) printf '%s\n' "$line" >> "$tmp" ;;
              esac
            done < "$f"
            mv "$tmp" "$f"
          done
          echo "已裁剪 filogic 厂商驱动 $PRUNED 项"
          # ---- 官方内核配置覆盖层 ----
          # 只取 CONFIG_KERNEL_* 段（含 "# CONFIG_KERNEL_x is not set" 形式）。
          # BUILD_DOMAIN / BUILD_USER 只影响构建者字符串、不参与 ABI，跳过。
          grep -E '^(#[[:space:]]+)?CONFIG_KERNEL_' config.buildinfo \
            | grep -vE 'CONFIG_KERNEL_(BUILD_DOMAIN|BUILD_USER)' > kernel-config.overlay || true
          COUNT=$(wc -l < kernel-config.overlay)
          [ "$COUNT" -ge 1 ] || { echo "::error::官方内核配置覆盖层为空"; exit 1; }
          # 指纹 = 覆盖层 + 裁剪后的目标配置：任一变化都使 build 缓存失效
          echo "hash=$({ cat kernel-config.overlay; cat sdk/target/linux/mediatek/filogic/config-6.*; } | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
          echo "----- 内核配置覆盖层（$COUNT 项，来源 ${{ steps.sdkurl.outputs.config }}）-----"
          cat kernel-config.overlay

      # ccache 只影响速度、不影响产物内容（同一编译器+参数产出一致的对象文件），
      # 因此按自然周滚动、可用 restore-keys 前缀回退到上周的温缓存：
      # master 快照升级内核版本（约每 1-2 周）触发重编时，绝大多数对象直接命中。
      - name: 恢复 ccache 缓存
        uses: actions/cache/restore@v4
        with:
          path: sdk/.ccache
          key: ccache-${{ matrix.tag }}-${{ steps.bucket.outputs.week }}
          restore-keys: |
            ccache-${{ matrix.tag }}-

      - name: 恢复 feeds 缓存
        id: cache-feeds
        uses: actions/cache/restore@v4
        with:
          path: sdk/feeds
          key: feeds-${{ matrix.tag }}-${{ steps.sdkurl.outputs.hash }}-${{ steps.bucket.outputs.week }}

      - name: 更新 feeds
        if: steps.cache-feeds.outputs.cache-hit != 'true'
        working-directory: sdk
        run: |
          set -euo pipefail
          # feeds.conf 中的 base feed 以 tag 指定(如 ;v24.10.8)，scripts/feeds
          # 用 `git clone --branch <tag>` 检出后 HEAD 处于 detached 状态，随后
          # 的 `git pull --ff-only` 报 "You are not currently on a branch"，
          # 整个作业在「更新 feeds」这一步直接失败。缓存恢复后的 feeds 内容由
          # 固定 tag/commit 决定、不会变化，因此精确命中缓存时跳过更新；未命中
          # (含 restore-keys 回退到上一周)时先删掉旧 base，让它重新克隆。
          rm -rf feeds/base
          ./scripts/feeds update -a

      - name: 保存 feeds 缓存
        if: steps.cache-feeds.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: sdk/feeds
          key: feeds-${{ matrix.tag }}-${{ steps.sdkurl.outputs.hash }}-${{ steps.bucket.outputs.week }}

      - name: 预编译 Rust 用户态程序
        working-directory: pkgsrc/luci-app-airpi-fancontrol/src
        run: |
          set -euxo pipefail
          LINKER=$(find "$GITHUB_WORKSPACE/sdk/staging_dir" -type f -name '*-gcc' -perm -111 | head -1)
          [ -n "$LINKER" ] || { echo "::error::未找到 OpenWrt 目标交叉链接器"; exit 1; }
          mkdir -p "$HOME/.cargo"
          printf '[target.aarch64-unknown-linux-musl]\nlinker = "%s"\n' "$LINKER" > "$HOME/.cargo/config.toml"
          cargo build --locked --release --target aarch64-unknown-linux-musl

      - name: 安装 feeds 中的软件包定义
        working-directory: sdk
        run: |
          set -euo pipefail
          # 先显式安装本项目直接依赖，缺失时立即报错；再全量 install 拉取传递依赖。
          ./scripts/feeds install -a
          ./scripts/feeds install luci-base kmod-hwmon-pwmfan 2>/dev/null || true

      - name: 链接本仓库软件包
        working-directory: sdk
        run: |
          set -euxo pipefail
          ln -sfn "$GITHUB_WORKSPACE/pkgsrc/luci-app-airpi-fancontrol" package/luci-app-airpi-fancontrol
          ln -sfn "$GITHUB_WORKSPACE/pkgsrc/airpi-gpio-fan" package/airpi-gpio-fan
          ls -l package/ | grep airpi

      # libffi 3.4.7 在某些树上把 fficonfig.h 生成到 $(PKG_BUILD_DIR)/<triplet>/，
      # 而 ImmortalWrt master 的 base feed 仍在 Build/InstallDev 里硬编码
      #   $(CP) $(PKG_BUILD_DIR)/$(GNU_TARGET_NAME)*/fficonfig.h $(1)/usr/include/
      # glob 一旦未命中就 cp: cannot stat 失败（v7.0.1/v7.0.2 的失败根因）。
      # tools/patch-libffi.py 与上游 openwrt/openwrt 的修法对齐：删掉硬编码
      # glob，改为从 PKG_INSTALL_DIR / PKG_BUILD_DIR 兜底复制，找不到就静默跳过。
      # 脚本幂等，对没有该问题的树（24.10 / 25.12）无副作用。
      - name: 修补 SDK 的 libffi staging 缺陷
        run: python3 "$GITHUB_WORKSPACE/pkgsrc/tools/patch-libffi.py" "$GITHUB_WORKSPACE/sdk"

      # 内核全量编译是单个作业最大的固定开销（约 95 分钟）。缓存 build_dir 与
      # staging_dir 的 target 部分后，SDK 指纹 + 内核版本 + 内核配置覆盖层均不变时
      # 直接复用，只有本仓库的两个包会重新编译。未命中时退化为全量编译，不影响正确性。
      # 注意：这里必须用精确键、不能用 restore-keys 前缀回退——回退会恢复到按旧
      # 配置编译的内核，让「生成内核配置覆盖层」静默失效，编出与官方固件不兼容的 .ko。
      - name: 恢复构建缓存
        id: cache-build
        uses: actions/cache/restore@v4
        with:
          path: |
            sdk/build_dir/target-*
            sdk/staging_dir/target-*
          key: build-${{ matrix.tag }}-${{ steps.sdkurl.outputs.hash }}-${{ steps.kver.outputs.kver }}-${{ steps.kconf.outputs.hash }}

      # 缓存恢复会把目录 mtime 写成解压时刻，比缓存里的 stamp 更新，make 会误判
      # 为源码变更而重编内核。这里只把恢复出来的目录（不含文件）时间戳回拨，
      # 让 stamp 与源码的时间关系保持原样。本仓库的包在 pkgsrc 下，不受影响。
      - name: 对齐缓存时间戳
        if: steps.cache-build.outputs.cache-hit == 'true'
        working-directory: sdk
        run: |
          set -euo pipefail
          STAMP=$(date -u -d '2 days ago' '+%Y-%m-%d %H:%M:%S')
          find feeds package build_dir/target-* staging_dir/target-* -type d -print0 2>/dev/null \
            | xargs -0 -r touch -c -h -d "$STAMP" || true
          echo "已回拨构建目录时间戳至 $STAMP"

      - name: 生成编译配置
        working-directory: sdk
        run: |
          set -euxo pipefail
          # 本 SDK 的 kconfig 对 .config 中重复出现的符号采用「首个赋值优先」：
          # 若先 make defconfig（默认 ALL=y，会写入数千行 =m），再追加
          # "# CONFIG_PACKAGE_lua is not set" 之类的行，追加行永远不生效。
          # 因此跳过初始 defconfig，直接从干净种子文件一次性生成完整配置。
          # 幂等:缓存 SDK 中可能残留旧 .config，先删除。
          # 官方内核配置覆盖层必须写在最前面：它与下面的种子行符号不重叠，
          # 但只有早于 defconfig 补的默认值，才会被「首个赋值优先」保留。
          rm -f .config
          cat "$GITHUB_WORKSPACE/kernel-config.overlay" > .config
          cat >> .config <<'EOF'
          CONFIG_CCACHE=y
          CONFIG_PACKAGE_luci-app-airpi-fancontrol=m
          CONFIG_PACKAGE_kmod-airpi-gpio-fan=m
          # SDK 的 Config.in 把 ALL 默认置 y（BUILDBOT 预设），连带
          # ALL_KMODS / ALL_NONSHARED，把数千个无关包拖成 =m：
          #   - liblucihttp-lua 被选中，lua 变体因 lua.h 未 staged 编译失败
          #     （v7.0.0 在 25.12 / master 上的失败根因）
          #   - ImmortalWrt master 上 ucode-mod-ffi(+libffi) 进入闭包，该树
          #     libffi 3.4.7 staging 存在打包 bug（v7.0.1 的失败根因）
          # 显式关闭，把构建闭包收敛到本应用的真实依赖。
          # CONFIG_ALL is not set
          # CONFIG_ALL_KMODS is not set
          # CONFIG_ALL_NONSHARED is not set
          # 退役 lua:本应用是 JS(客户端视图)+ ucode(LuCI 运行时)+ Rust
          # (守护进程)架构，luci-base 在 24.10 / 25.12 / master 上都只依赖
          # ucode 系包，不需要任何 lua 组件。
          # CONFIG_PACKAGE_lua is not set
          # CONFIG_PACKAGE_liblua is not set
          # CONFIG_PACKAGE_luci-lua-runtime is not set
          # CONFIG_PACKAGE_luci-compat is not set
          # CONFIG_PACKAGE_liblucihttp-lua is not set
          # CONFIG_PACKAGE_luci-lib-base is not set
          # CONFIG_PACKAGE_ucode-mod-ffi is not set
          # SDK defconfig 会把 DEFAULT=y 的基础包拖进闭包（约 35 个，其中
          # util-linux/mtd-utils 等明显与本插件无关，单项即 1-2 分钟）。
          # 显式裁掉；若某项实际是真实依赖，defconfig 会重新选中，无副作用。
          # CONFIG_PACKAGE_dnsmasq is not set
          # CONFIG_PACKAGE_odhcpd is not set
          # CONFIG_PACKAGE_firewall4 is not set
          # CONFIG_PACKAGE_linux-firmware is not set
          # CONFIG_PACKAGE_mtd-utils is not set
          # CONFIG_PACKAGE_util-linux is not set
          EOF
          make defconfig </dev/null
          # 覆盖层必须进入生成的 .config，内核才会按官方固件的配置编译。
          # 两种 SDK 布局都要覆盖：
          #   - SDK 的 kconfig 认识这些符号：种子行在最前，「首个赋值优先」保留
          #   - SDK 的 kconfig 不认识：defconfig 把种子行丢掉，此时补写在末尾，
          #     它就是该符号在 .config 里的唯一赋值，同样生效
          while IFS= read -r line; do
            if grep -qxF "$line" .config; then
              echo "  ok        $line"
            else
              printf '%s\n' "$line" >> .config
              echo "  appended  $line"
            fi
          done < "$GITHUB_WORKSPACE/kernel-config.overlay"
          MISS=0
          while IFS= read -r line; do
            grep -qxF "$line" .config || { echo "::error::覆盖层符号未进入 .config: $line"; MISS=1; }
          done < "$GITHUB_WORKSPACE/kernel-config.overlay"
          [ "$MISS" -eq 0 ] || { echo "::error::官方内核配置覆盖层未生效"; exit 1; }
          echo "----- 生效的相关配置 -----"
          grep -E 'airpi' .config || { echo "::error::软件包未出现在 .config 中，请检查 Makefile 依赖"; exit 1; }
          grep -E '^CONFIG_CCACHE=' .config || { echo "::error::CONFIG_CCACHE 未生效，请检查 SDK 的 config/Config-devel.in"; exit 1; }
          echo "----- libffi / ffi 相关配置（诊断用） -----"
          grep -E 'ffi' .config || echo "（无 ffi 相关条目）"
          # 退役 lua 校验:若下列组件仍被 kconfig 选中,说明依赖树里还有隐藏的
          # lua 依赖边,直接失败暴露,而不是在编译期报 lua.h 之类的间接错误。
          if grep -E '^CONFIG_PACKAGE_(lua|liblua|luci-lua-runtime|luci-compat|liblucihttp-lua|luci-lib-base)=' .config; then
            echo "::error::lua 组件仍被选中,退役 lua 失败"
            exit 1
          fi

      # 默认静默（V 不含 s）以减少 GB 级日志；一旦失败则用 V=s 重跑一次,
      # 把真实错误（依赖缺失/编译报错）打到日志,避免只看到 "exit code 2"。
      # 注意:include/verbose.mk 以 "V 值是否含 s" 判断详细输出,
      # 因此 V=sc 仍会触发详细输出,不能作为静默开关。
      # 所有 make 都重定向 stdin:SDK 的 .config 若出现新符号会拉起交互式
      # menuconfig,在 CI 里表现为一直挂到超时,重定向后直接失败报错。

      - name: 编译 luci-app-airpi-fancontrol
        working-directory: sdk
        run: |
          set -euo pipefail
          if ! make package/luci-app-airpi-fancontrol/compile -j$(nproc) \
                AIRPI_PREBUILT=1 \
                AIRPI_PREBUILT_BIN="$GITHUB_WORKSPACE/pkgsrc/luci-app-airpi-fancontrol/src/target/aarch64-unknown-linux-musl/release/airpi-fanctl" \
                </dev/null; then
            echo "::error::首次编译失败,以 V=s 重跑以获取诊断信息"
            make package/luci-app-airpi-fancontrol/compile V=s -j1 \
              AIRPI_PREBUILT=1 \
              AIRPI_PREBUILT_BIN="$GITHUB_WORKSPACE/pkgsrc/luci-app-airpi-fancontrol/src/target/aarch64-unknown-linux-musl/release/airpi-fanctl" \
              </dev/null
          fi

      - name: 编译 kmod-airpi-gpio-fan
        working-directory: sdk
        run: |
          set -euo pipefail
          if ! make package/airpi-gpio-fan/compile -j$(nproc) </dev/null; then
            echo "::error::kmod 首次编译失败,以 V=s 重跑以获取诊断信息"
            make package/airpi-gpio-fan/compile V=s -j1 </dev/null
          fi

      # 保存失败（同 key 已存在/目录不存在）不应让作业变红
      - name: 保存 ccache 缓存
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: sdk/.ccache
          key: ccache-${{ matrix.tag }}-${{ steps.bucket.outputs.week }}

      # 编译后校验：覆盖层里的每个符号都必须按预期值出现在内核 .config 中。
      # 二者一致即证明 .ko 与官方固件的内核配置逐位相同（同一 SDK 指纹下 target
      # 配置文件也同源），模块必然可被官方固件加载。不一致说明 SDK 的 kconfig
      # 丢掉了某个符号（新符号挂起或被默认值覆盖），此时宁可失败，
      # 也不能把加载不上的 .ko 发成 Release。
      - name: 校验内核配置与官方固件一致
        working-directory: sdk
        run: |
          set -euo pipefail
          KCONF=$(ls -d build_dir/target-*/linux-*/linux-*/.config 2>/dev/null | head -1)
          [ -n "$KCONF" ] || { echo "::error::未找到内核 .config，内核未配置？"; exit 1; }
          echo "内核配置: $KCONF"
          FAIL=0
          while IFS= read -r line; do
            sym=$(printf '%s\n' "$line" | sed -E 's/^#[[:space:]]+//; s/^CONFIG_KERNEL_([A-Za-z0-9_]+).*$/\1/')
            [ -n "$sym" ] || continue
            case "$line" in
              \#*)
                # 未设置项：显式 not-set 或根本不出现在内核配置中都算通过
                if grep -qE "^# CONFIG_${sym} is not set" "$KCONF"; then
                  echo "  ok  (未设置) CONFIG_${sym}"
                elif grep -qE "^CONFIG_${sym}=" "$KCONF"; then
                  echo "::error::CONFIG_${sym} 应为未设置，实际为 $(grep -E "^CONFIG_${sym}=" "$KCONF" | head -1)"
                  FAIL=1
                else
                  echo "  ok  (内核配置中无此项) CONFIG_${sym}"
                fi
                ;;
              *)
                val=${line#CONFIG_KERNEL_${sym}=}
                if grep -qxF "CONFIG_${sym}=${val}" "$KCONF"; then
                  echo "  ok  CONFIG_${sym}=${val}"
                else
                  echo "::error::CONFIG_${sym}=${val} 未按预期出现在内核 .config 中（实际: $(grep -E "^CONFIG_${sym}=" "$KCONF" | head -1 || echo 无)）"
                  FAIL=1
                fi
                ;;
            esac
          done < "$GITHUB_WORKSPACE/kernel-config.overlay"

          # .ko 的 ABI 观测量：this_module 区段大小与重定位数。官方固件的参考值
          # 见 README「差异根源」一节；这里记录到日志，便于发布前人工比对。
          KO=$(find build_dir -name 'airpi-gpio-fan.ko' 2>/dev/null | head -1)
          if [ -n "$KO" ]; then
            echo "----- .ko ABI 观测量: $KO -----"
            readelf -SW "$KO" | grep this_module || echo "  (无 this_module 区段！)"
            echo "  __this_module 重定位数: $(readelf -rW "$KO" 2>/dev/null | grep -c '__this_module' || true)"
          else
            echo "::warning::未找到 airpi-gpio-fan.ko，跳过 ABI 观测量记录"
          fi

          [ "$FAIL" -eq 0 ] || { echo "::error::内核配置与官方固件不一致，终止发布"; exit 1; }
          echo "内核配置与官方固件一致"

      # 内核与依赖包的编译产物是本次运行最贵的产出,缓存下来给后续运行复用。
      # 保存失败（例如同 key 已存在）不应让作业变红,故 continue-on-error。
      - name: 保存构建缓存
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            sdk/build_dir/target-*
            sdk/staging_dir/target-*
          key: build-${{ matrix.tag }}-${{ steps.sdkurl.outputs.hash }}-${{ steps.kver.outputs.kver }}-${{ steps.kconf.outputs.hash }}

      - name: 收集安装包
        working-directory: sdk
        run: |
          set -euxo pipefail
          OUT="$GITHUB_WORKSPACE/artifacts"
          mkdir -p "$OUT"
          find bin/ -type f \( -name '*airpi*.ipk' -o -name '*airpi*.apk' \) -exec cp -v {} "$OUT/" \;
          echo "----- 产出清单 -----"
          ls -lh "$OUT"
          COUNT=$(find "$OUT" -type f \( -name '*.ipk' -o -name '*.apk' \) | wc -l)
          if [ "$COUNT" -lt 2 ]; then
            echo "::error::期望至少 2 个安装包（LuCI 应用 + 内核模块），实际只有 $COUNT 个"
            exit 1
          fi

      - name: 上传构建日志（仅失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.tag }}
          path: sdk/logs
          if-no-files-found: ignore
          retention-days: 7

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: airpi-fancontrol-${{ matrix.tag }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30

      - name: 输出构建耗时
        if: always()
        run: |
          DUR=$(( $(date +%s) - ${BUILD_START:-$(date +%s)} ))
          printf '📦 %s 本次耗时 %d 分 %d 秒\n' "${{ matrix.tag }}" $((DUR/60)) $((DUR%60))

  # 注意：这里的 'release' 也是系统识别的 Job ID，必须用英文
  release:
    name: 🚀 发布到 Releases
    needs: build
    runs-on: ubuntu-24.04
    concurrency:
      group: release-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 下载全部构建产物
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: 整理发布文件（按目标重命名，避免同名覆盖）
        id: prep
        run: |
          set -euxo pipefail
          mkdir -p release

          # 三个矩阵目标编译出的 LuCI 包文件名原本完全相同（均为
          # luci-app-airpi-fancontrol-<ver>.apk），汇总到一起会互相覆盖，
          # 导致 25.12 与 immortalwrt-master 只剩一个且无法区分。
          # 这里按构建目标追加后缀，让文件名自解释。
          for pair in \
            "dist/airpi-fancontrol-ipk:openwrt-24.10" \
            "dist/airpi-fancontrol-apk:openwrt-25.12" \
            "dist/airpi-fancontrol-immortalwrt-master:immortalwrt-master" ; do
            dir="${pair%%:*}"; suffix="${pair##*:}"
            if [ ! -d "$dir" ]; then
              echo "::warning::缺少产物目录 $dir（该目标可能未产出）"
              continue
            fi
            while IFS= read -r -d '' f; do
              base=$(basename "$f")
              case "$base" in
                *.ipk) cp -v "$f" "release/${base%.ipk}_${suffix}.ipk" ;;
                *.apk) cp -v "$f" "release/${base%.apk}_${suffix}.apk" ;;
              esac
            done < <(find "$dir" -type f \( -name '*.ipk' -o -name '*.apk' \) -print0)
          done

          ls -lh release
          COUNT=$(find release -type f \( -name '*.ipk' -o -name '*.apk' \) | wc -l)
          if [ "$COUNT" -lt 2 ]; then
            echo "::error::release 目录仅 $COUNT 个安装包，少于期望的 2 个"
            exit 1
          fi
          echo "共 $COUNT 个安装包"

          if [ -n "${{ github.event.inputs.release_tag }}" ]; then
            TAG="${{ github.event.inputs.release_tag }}"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v$(date +'%Y%m%d%H%M%S')"
            echo "未提供标签，自动生成时间标签: $TAG"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: 生成中文发布说明
        run: |
          set -euo pipefail
          TAG="${{ steps.prep.outputs.tag }}"
          OUT=RELEASE_NOTES.md
          : > "$OUT"

          echo "## AirPi AP3000M 风扇控制 ${TAG}" >> "$OUT"
          echo >> "$OUT"

          # 静态说明取自独立模板，避免 markdown 缩进被 shell heredoc 破坏
          cat .github/RELEASE_TEMPLATE.md >> "$OUT"
          echo >> "$OUT"

          # ---- 从 CHANGELOG 提取更新内容 ----
          # 时间戳 tag（v2026...）在 CHANGELOG 中并无对应章节，此时回退提取「未发布」段。
          SECTION=$(awk -v tag="${TAG#v}" '
            !flag && (index($0, "## [" tag "]") == 1 || index($0, "## " tag) == 1) { flag=1; next }
            flag && /^## / { exit }
            flag { print }
          ' CHANGELOG.md || true)

          FALLBACK=0
          if [ -z "$(printf '%s' "$SECTION" | tr -d '[:space:]')" ]; then
            SECTION=$(awk '
              !flag && (index($0, "## [未发布]") == 1 || index($0, "## 未发布") == 1) { flag=1; next }
              flag && /^## / { exit }
              flag { print }
            ' CHANGELOG.md || true)
            FALLBACK=1
          fi

          if [ -n "$(printf '%s' "$SECTION" | tr -d '[:space:]')" ]; then
            echo "## 更新内容" >> "$OUT"
            echo >> "$OUT"
            if [ "$FALLBACK" -eq 1 ]; then
              echo "> 本版本未打语义化标签，以下内容取自 CHANGELOG 的「未发布」段。" >> "$OUT"
            fi
            printf '%s\n' "$SECTION" >> "$OUT"
            echo >> "$OUT"
          else
            echo "::warning::未能从 CHANGELOG 提取到更新内容"
          fi

          # ---- 文件校验表 ----
          echo "## 文件校验" >> "$OUT"
          echo >> "$OUT"
          echo "| 文件 | SHA-256 | 大小 |" >> "$OUT"
          echo "| --- | --- | --- |" >> "$OUT"
          while IFS= read -r -d '' f; do
            base=$(basename "$f")
            sum=$(sha256sum "$f" | cut -d' ' -f1)
            size=$(du -h "$f" | cut -f1)
            echo "| \`$base\` | \`$sum\` | $size |" >> "$OUT"
          done < <(find release -type f \( -name '*.ipk' -o -name '*.apk' \) -print0 | sort -z)
          echo >> "$OUT"

          echo "完整变更记录见 [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md)。" >> "$OUT"

          echo "----- 发布说明预览 -----"
          cat "$OUT"

      - name: 创建或更新 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.prep.outputs.tag }}"
          TITLE="AirPi AP3000M 风扇控制 ${TAG}"

          echo "===== 当前 tag ====="
          echo "$TAG"

          if [ -z "$(ls -A release 2>/dev/null)" ]; then
            echo "::error::release 目录为空，没有找到任何 .ipk/.apk 文件"
            exit 1
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "标签已存在，执行 upload + edit"
            gh release upload "$TAG" release/* --clobber
            gh release edit "$TAG" --title "$TITLE" --notes-file RELEASE_NOTES.md
          else
            echo "标签不存在，执行 create"
            gh release create "$TAG" release/* --title "$TITLE" --notes-file RELEASE_NOTES.md
          fi
